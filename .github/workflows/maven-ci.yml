# Source: C:\Development\pipelines-java3\azure-pipelines.yml
# Review candidate, not a parity-complete replacement:
# - JUnit/JaCoCo artifacts below do not replace Azure test runs or coverage UI.
# - Maven@4 rewrites the POM for JaCoCo; equivalence with the existing POM's
#   JaCoCo 0.8.2 configuration remains blocked by unavailable task-source evidence.
# - Source checkout settings and artifact retention can be overridden outside
#   YAML; confirm them before retiring the Azure pipeline.
# Setup: enable GitHub Actions and allow the pinned official actions below.
# No user-defined secrets, variables, service connections, or environments needed.
# GitHub may require approval for fork PRs; no secrets or write token are granted.
# JDK vendor was unspecified: Temurin 11 x64 matches the required Java version
# and the POM's JaCoCo 0.8.2 compatibility. Maven remains runner-provided.
# Action SHAs were resolved from official GitHub API version-tag references.
# Detailed action metadata reference requests were denied; review remains open.
name: Maven CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Initialize Maven environment
        run: |
          echo "MAVEN_CACHE_FOLDER=$RUNNER_TEMP/.m2/repository" >> "$GITHUB_ENV"
          echo "MAVEN_OPTS=-Dmaven.repo.local=$RUNNER_TEMP/.m2/repository" >> "$GITHUB_ENV"

      - name: Set up JDK 11
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '11'
          architecture: x64
          overwrite-settings: false

      - name: Cache Maven packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.MAVEN_CACHE_FOLDER }}
          key: maven-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Build, test and package
        id: build
        run: mvn -f pom.xml -B clean verify

      # Direct upload preserves the flat *.war selection without an extra copy.
      - name: Publish WAR artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: drop
          path: target/*.war
          # CopyFiles@2 succeeds when no files match; do not add a new gate.
          if-no-files-found: warn

      # Retain diagnostics after Maven failure without masking its exit status.
      - name: Retain JUnit reports (publication parity unresolved)
        if: ${{ !cancelled() && steps.build.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: junit-results
          path: '**/surefire-reports/TEST-*.xml'
          if-no-files-found: warn

      - name: Retain JaCoCo reports (publication parity unresolved)
        if: ${{ !cancelled() && steps.build.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jacoco-results
          path: target/site/jacoco/
          # Maven@4 defaults codeCoverageFailIfEmpty to false.
          if-no-files-found: warn
