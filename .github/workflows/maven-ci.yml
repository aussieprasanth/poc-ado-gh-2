# Source: azure-pipelines.yml (repository root); original source is unchanged.
# Review blockers:
# - Maven@4 rewrites the POM for JaCoCo. This draft uses the existing POM's
#   JaCoCo 0.8.2 executions; equivalence of the task's injected setup is unresolved.
# - Report artifacts retain results but do not replace Azure's published JUnit
#   test runs or coverage views. Reporting parity remains unresolved.
# Setup: enable GitHub Actions and allow the actions below. No custom secrets
# or repository variables are required. Retention uses GitHub repository policy;
# compare it with the Azure project policy before retiring the source pipeline.
name: Maven CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # ADO pr.autoCancel defaults to true; push runs remain independent.
    concurrency:
      group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Initialize Maven cache location
        run: |
          echo "MAVEN_CACHE_FOLDER=$RUNNER_TEMP/.m2/repository" >> "$GITHUB_ENV"
          echo "MAVEN_OPTS=-Dmaven.repo.local=$RUNNER_TEMP/.m2/repository" >> "$GITHUB_ENV"

      # The source specifies JDK 11 x64, but no vendor or Maven version.
      # Temurin supports JDK 11; Maven remains the hosted image's default.
      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
          architecture: x64
          overwrite-settings: false

      - name: Cache Maven packages
        uses: actions/cache@v5
        with:
          path: ${{ env.MAVEN_CACHE_FOLDER }}
          key: maven-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Build, test and package
        id: maven
        run: mvn -f pom.xml clean verify -B

      # Preserve available reports after Maven failure without masking its exit
      # status. Missing reports are not a new test or coverage gate.
      - name: Retain JUnit and JaCoCo reports
        if: ${{ !cancelled() && (steps.maven.outcome == 'success' || steps.maven.outcome == 'failure') }}
        uses: actions/upload-artifact@v6
        with:
          name: maven-reports
          path: |
            **/surefire-reports/TEST-*.xml
            target/site/jacoco/
          if-no-files-found: warn

      - name: Stage WAR file
        run: |
          mkdir -p "$RUNNER_TEMP/artifact-staging"
          shopt -s nullglob dotglob
          wars=(target/*.war)
          if ((${#wars[@]})); then
            cp --no-clobber -- "${wars[@]}" "$RUNNER_TEMP/artifact-staging/"
          else
            echo "::warning::No target/*.war files matched; CopyFiles@2 also succeeds with no matches."
          fi

      - name: Publish WAR artifact
        uses: actions/upload-artifact@v6
        with:
          name: drop
          path: ${{ runner.temp }}/artifact-staging/
          if-no-files-found: warn
