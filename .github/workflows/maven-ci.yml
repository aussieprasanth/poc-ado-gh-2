# Source: C:\Development\pipelines-java3\azure-pipelines.yml
# Review blockers: raw report artifacts do not reproduce ADO test/coverage UI.
# Maven@4 also modifies the POM for coverage; equivalence of that injected
# configuration with the existing JaCoCo 0.8.2 configuration is unverified.
# No project secrets, repository variables, environments, or OIDC trust required.
# Enable these first-party actions in repository/organization Actions settings.
# Align artifact retention and fork-PR approval settings outside this YAML.
name: Maven CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

# ADO pr.autoCancel defaults to true; independent push builds are not canceled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build, test and package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Initialize Maven and artifact paths
        run: |
          printf 'MAVEN_CACHE_FOLDER=%s/.m2/repository\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'MAVEN_OPTS=-Dmaven.repo.local=%s/.m2/repository\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'ARTIFACT_STAGING_DIRECTORY=%s/artifact-staging\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ${{ env.MAVEN_CACHE_FOLDER }}
          key: maven-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      # The source selects Java 11 x64 without a distribution or patch version.
      # Temurin 11 is supported by setup-java and compatible with JaCoCo 0.8.2.
      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
          architecture: x64
          overwrite-settings: false

      # Maven remains the runner-provided default, as in Maven@4.
      # Existing POM executions prepare JaCoCo and generate its report at test.
      - name: Build, test and package
        id: maven
        run: mvn -B -f pom.xml clean verify

      # Preserve available diagnostics after Maven failure without masking it.
      # These downloads are NOT equivalent to native ADO test/coverage publishing.
      - name: Retain JUnit results
        if: ${{ (success() || failure()) && steps.maven.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: '**/surefire-reports/TEST-*.xml'
          if-no-files-found: warn

      - name: Retain JaCoCo reports
        if: ${{ (success() || failure()) && steps.maven.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: |
            target/site/jacoco/
            target/jacoco.exec
          if-no-files-found: warn

      - name: Stage WAR file
        run: |
          test -d target
          mkdir -p "$ARTIFACT_STAGING_DIRECTORY"
          shopt -s nullglob
          war_files=(target/*.war)
          if (( ${#war_files[@]} )); then
            cp -- "${war_files[@]}" "$ARTIFACT_STAGING_DIRECTORY/"
          else
            # CopyFiles@2 succeeds when no files match; do not add a failure gate.
            printf '%s\n' '::warning::No target/*.war files found to stage.'
          fi

      - name: Publish WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: drop
          path: ${{ env.ARTIFACT_STAGING_DIRECTORY }}
          if-no-files-found: warn
