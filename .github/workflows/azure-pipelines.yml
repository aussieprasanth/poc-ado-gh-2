name: Maven build

# Source: azure-pipelines.yml (no referenced templates or scripts).
# Setup: enable GitHub Actions and allow the official actions used below.
# No custom secrets, repository variables, environments, or cloud trust are needed.
# Reports use job summaries, failure annotations, and downloadable attachments,
# not Azure DevOps test runs or its coverage UI.
# Parity blocker: Maven@4 rewrites the POM when coverage is enabled. Its exact
# injected configuration is not present in the source repository; this workflow
# retains the explicit JaCoCo 0.8.2 configuration in pom.xml without changing it.
# Service-side checkout, fork approval, and retention settings are not exported
# in the source YAML and must be reconciled before claiming full parity.

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

# ADO pr.autoCancel defaults to true; independent push builds are not canceled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build, test and package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Initialize Maven and artifact paths
        run: |
          {
            printf 'MAVEN_CACHE_FOLDER=%s/.m2/repository\n' "$RUNNER_TEMP"
            printf 'MAVEN_OPTS=-Dmaven.repo.local=%s/.m2/repository\n' "$RUNNER_TEMP"
            printf 'ARTIFACT_STAGING_DIRECTORY=%s/artifact-staging\n' "$RUNNER_TEMP"
          } >> "$GITHUB_ENV"

      - name: Cache Maven packages
        uses: actions/cache@v5
        with:
          path: ${{ env.MAVEN_CACHE_FOLDER }}
          key: maven-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      # The source selects Java 11 x64 but does not specify a distribution or
      # Maven release. Temurin 11 is compatible; Maven remains runner-provided.
      # These official action majors have verified Node.js 24 releases.
      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
          architecture: x64
          overwrite-settings: false

      - name: Build, test and package
        id: maven
        run: mvn -B clean verify

      - name: Publish test and coverage summaries
        if: ${{ !cancelled() && (steps.maven.outcome == 'success' || steps.maven.outcome == 'failure') }}
        run: |
          python3 - <<'PY'
          import html
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          def escape_command(value):
              return value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          def cell(value):
              return html.escape(value).replace("|", "&#124;").replace("\r", " ").replace("\n", " ")

          reports = sorted(Path(".").glob("**/surefire-reports/TEST-*.xml"))
          tests = []
          for report in reports:
              root = ET.parse(report).getroot()
              tests.extend(root.iter("testcase"))

          failures = 0
          skipped = 0
          rows = []
          for test in tests:
              name = f"{test.get('classname', '')}.{test.get('name', '')}"
              problems = [child for child in test if child.tag in ("failure", "error")]
              if problems:
                  failures += 1
                  status = "Failed"
                  for problem in problems:
                      detail = problem.get("message") or problem.text or problem.tag
                      print(f"::error title=Test failure::{escape_command(name + ': ' + detail)}")
              elif test.find("skipped") is not None:
                  skipped += 1
                  status = "Skipped"
              else:
                  status = "Passed"
              rows.append(f"| <code>{cell(name)}</code> | {status} |")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## JUnit test results\n\n")
              if reports:
                  summary.write(
                      f"{len(tests)} tests: {len(tests) - failures - skipped} passed, "
                      f"{failures} failed, {skipped} skipped.\n\n"
                  )
                  summary.write("| Test | Result |\n| --- | --- |\n")
                  summary.write("\n".join(rows) + "\n\n")
              else:
                  print("::warning::No JUnit reports matched **/surefire-reports/TEST-*.xml.")
                  summary.write("No matching JUnit reports were produced.\n\n")

              summary.write("## JaCoCo coverage\n\n")
              coverage = Path("target/site/jacoco/jacoco.xml")
              if coverage.is_file():
                  counters = ET.parse(coverage).getroot().findall("counter")
                  summary.write("| Metric | Covered | Missed | Coverage |\n| --- | ---: | ---: | ---: |\n")
                  for counter in counters:
                      covered = int(counter.attrib["covered"])
                      missed = int(counter.attrib["missed"])
                      total = covered + missed
                      percentage = f"{100 * covered / total:.2f}%" if total else "N/A"
                      summary.write(
                          f"| {cell(counter.attrib['type'])} | {covered} | {missed} | {percentage} |\n"
                      )
                  if not counters:
                      print("::warning::JaCoCo report contains no coverage counters.")
                  summary.write("\nNo coverage threshold is configured in the source pipeline.\n")
              else:
                  print("::warning::No JaCoCo XML report was produced; source failIfCoverageEmpty defaults to false.")
                  summary.write("No JaCoCo XML report was produced. Missing coverage is not a build gate.\n")
          PY

      - name: Attach JUnit results
        if: ${{ !cancelled() && (steps.maven.outcome == 'success' || steps.maven.outcome == 'failure') }}
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: '**/surefire-reports/TEST-*.xml'
          if-no-files-found: warn

      - name: Attach JaCoCo report
        if: ${{ !cancelled() && (steps.maven.outcome == 'success' || steps.maven.outcome == 'failure') }}
        uses: actions/upload-artifact@v6
        with:
          name: code-coverage
          path: target/site/jacoco/
          if-no-files-found: warn

      - name: Stage WAR file
        run: |
          if [[ ! -d target ]]; then
            echo "::error::Source folder target does not exist."
            exit 1
          fi
          mkdir -p "$ARTIFACT_STAGING_DIRECTORY"
          shopt -s nullglob
          wars=(target/*.war)
          if (( ${#wars[@]} )); then
            cp -- "${wars[@]}" "$ARTIFACT_STAGING_DIRECTORY/"
          else
            echo "::warning::No target/*.war files matched; CopyFiles@2 also succeeds with no matches."
          fi

      - name: Publish WAR artifact
        uses: actions/upload-artifact@v6
        with:
          name: drop
          path: ${{ env.ARTIFACT_STAGING_DIRECTORY }}
          if-no-files-found: warn
